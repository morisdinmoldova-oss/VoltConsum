<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none" role="img">
  <title>Peisaj solar fotovoltaic</title>
  <desc>Panouri fotovoltaice pe un acoperiș, soare la apus, locuință și peisaj verde.</desc>
  <defs>
